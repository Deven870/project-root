version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: voicebot-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-voicebot}
    ports:
      - \"5432:5432\"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [\"CMD-SHELL\", \"pg_isready -U ${DB_USER:-postgres}\"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voicebot-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebot-api
    environment:
      ENVIRONMENT: production
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-voicebot}
      ENABLE_API: \"true\"
      ENABLE_DASHBOARD: \"false\"
      ENABLE_SCHEDULER: \"false\"
    ports:
      - \"5000:5000\"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: [\"--api-only\"]
    networks:
      - voicebot-network
    restart: unless-stopped

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebot-dashboard
    environment:
      ENVIRONMENT: production
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-voicebot}
      ENABLE_API: \"false\"
      ENABLE_DASHBOARD: \"true\"
      ENABLE_SCHEDULER: \"false\"
    ports:
      - \"8501:8501\"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: [\"--dashboard-only\"]
    networks:
      - voicebot-network
    restart: unless-stopped

  # Background Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebot-scheduler
    environment:
      ENVIRONMENT: production
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-voicebot}
      ENABLE_API: \"false\"
      ENABLE_DASHBOARD: \"false\"
      ENABLE_SCHEDULER: \"true\"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: [\"--scheduler-only\"]
    networks:
      - voicebot-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  voicebot-network:
    driver: bridge
