version: '3.9'

services:
  # ===== REDIS (Cache & Queue) =====
  redis:
    image: redis:7-alpine
    container_name: digitrader-redis-v5
    ports:
      - "6379:6379"
    volumes:
      - redis_data_v5:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - digitrader_v5

  # ===== FASTAPI BACKEND =====
  backend:
    build: ./backend
    container_name: digitrader-backend-v5
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./digitrader.db
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALPHA_VANTAGE_KEY: K5T3L5U9N6QFQLXB
      FINNHUB_KEY: d78dqqhr01qhel7vjal0
      DEBUG: "False"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./modules:/app/../modules
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - digitrader_v5

  # ===== CELERY WORKER =====
  celery_worker:
    build: ./backend
    container_name: digitrader-worker-v5
    environment:
      DATABASE_URL: sqlite:///./digitrader.db
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALPHA_VANTAGE_KEY: K5T3L5U9N6QFQLXB
      FINNHUB_KEY: d78dqqhr01qhel7vjal0
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - ./modules:/app/../modules
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=5
    networks:
      - digitrader_v5

  # ===== CELERY BEAT (Scheduler) =====
  celery_beat:
    build: ./backend
    container_name: digitrader-beat-v5
    environment:
      DATABASE_URL: sqlite:///./digitrader.db
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - ./modules:/app/../modules
    command: celery -A workers.celery_app beat --loglevel=info
    networks:
      - digitrader_v5

  # ===== REACT FRONTEND =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digitrader-frontend-v5
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev
    networks:
      - digitrader_v5

networks:
  digitrader_v5:
    driver: bridge

volumes:
  redis_data_v5:
    driver: local
